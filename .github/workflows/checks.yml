name: Dashboard checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check installer syntax
        run: bash -n scripts/install.sh
      - name: Run dashboard regression tests
        run: node tests/check-dashboard.cjs
      - name: Run malicious-input regression tests
        run: node tests/security.cjs
