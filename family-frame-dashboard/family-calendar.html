window.loadWeather=function(force){if(s.clockOptions.hideWeather||wxBusy||!force&&wx&&Date.now()-wxAt<15*60000)return;wxBusy=true;wxError='';paintWeather();var o=s.clockOptions,locationKey=o.lat+','+o.lon+','+o.unit;requestJson('https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(o.lat)+'&longitude='+encodeURIComponent(o.lon)+'&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit='+encodeURIComponent(o.unit)+'&timezone=auto&forecast_days=3',function(err,data){wxBusy=false;if(locationKey!==s.clockOptions.lat+','+s.clockOptions.lon+','+s.clockOptions.unit){loadWeather(true);return}if(err){wxError=err;paintWeather();return}if(!data.current||!data.daily||!Array.isArray(data.daily.time)||!data.daily.temperature_2m_max||!data.daily.temperature_2m_min||!data.daily.weather_code){wxError='Weather data unavailable.';paintWeather();return}wx=data;wxAt=Date.now();paintWeather()})};

function nyParts(ms){var d=new Date(ms),y=d.getUTCFullYear();var mar=new Date(Date.UTC(y,2,1)),nov=new Date(Date.UTC(y,10,1));var start=Date.UTC(y,2,8+(7-mar.getUTCDay())%7,7),end=Date.UTC(y,10,1+(7-nov.getUTCDay())%7,6);var off=ms>=start&&ms<end?-4:-5;var n=new Date(ms+off*3600000);return {year:n.getUTCFullYear(),month:n.getUTCMonth()+1,day:n.getUTCDate(),hour:n.getUTCHours(),minute:n.getUTCMinutes(),second:n.getUTCSeconds(),offset:off}}
function prayerDateKey(ms){var n=nyParts(ms);return n.year+'-'+('0'+n.month).slice(-2)+'-'+('0'+n.day).slice(-2)}

function prayerTime(ms){var n=nyParts(ms);return (n.hour%12||12)+':'+('0'+n.minute).slice(-2)+' '+(n.hour<12?'AM':'PM')}
function prayerIso(value){var m=/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d):\d\d([+-])(\d\d):(\d\d)$/.exec(String(value));if(!m)return NaN;return Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5])-((+m[7]*60 + +m[8])*(m[6]==='+'?1:-1))*60000}
function prayerRows(){var out=[];Object.keys(ps.cache).forEach(function(k){if(k.indexOf(ps.method+'-'+ps.school+'-')!==0)return;var entry=ps.cache[k];if(!entry||!Array.isArray(entry.days))return;entry.days.forEach(function(day){if(!day||!Array.isArray(day.times))return;prayerNames.forEach(function(name,i){var base=day.times[i],delta=Math.max(-30,Math.min(30,Number(ps.offsets[name])||0));if(typeof base==='number'&&isFinite(base))out.push({name:name,index:i,date:day.date,at:base+delta*60000,key:day.date+'-'+name})})})});return out.sort(function(a,b){return a.at-b.at})}

function prayerView(){var now=Date.now(),today=prayerDateKey(now),rows=prayerRows().filter(function(r){return r.date===today}),next=prayerNext(now);return '<section class="prayerboard"><div class="prayerheading"><div><small>QUEENS, NEW YORK · AMERICA/NEW_YORK</small><h2>Prayer clock <span lang="ar">مواقيت الصلاة</span></h2><p>'+esc(today)+' · '+esc(prayerMethods[ps.method])+' · '+(ps.school==='1'?'Hanafi':'Standard')+' Asr</p></div><div><button onclick="prayerSettings()">Prayer settings</button> <button onclick="refreshPrayers(true)">Refresh</button></div></div><div class="prayernext"><small>NEXT PRAYER</small><h2>'+(next?esc(next.name)+' · '+prayerTime(next.at):'Waiting for prayer times')+'</h2><div id="prayercountdown">'+(next?prayerCountdown(next.at-now):'—')+'</div></div><div class="prayertimes">'+prayerNames.map(function(name,i){var row=rows.filter(function(r){return r.name===name})[0];return '<div class="prayertime '+(next&&next.key===(row&&row.key)?'upcoming':'')+'"><span lang="ar">'+prayerArabic[i]+'</span><h3>'+name+'</h3><strong>'+(row?prayerTime(row.at):'—')+'</strong><small>'+(ps.enabled&&!ps.muted[name]?'Adhan on':'Adhan off')+((Number(ps.offsets[name])||0)?' · '+(Number(ps.offsets[name])>0?'+':'')+Number(ps.offsets[name])+' min':'')+'</small></div>'}).join('')+'</div><div class="prayeractions"><button onclick="testAdhan()">▶ Test adhan now</button><button onclick="testAdhanLater()">Test automatic audio in 10 seconds</button><button onclick="stopAdhan()">■ Stop audio / cancel test</button></div><p id="prayeraudiostatus">'+esc(prayerAudioStatus)+'</p><p id="prayernetwork">'+esc(prayerStatus())+'</p><p class="prayernote">Calculated start times, not mosque iqamah times. Compare with your mosque and adjust in Prayer settings. Cached calendars work offline; audio needs a local MP3 for offline playback. Keep the frame powered, awake and the dashboard open for scheduled adhan.</p><a href="https://aladhan.com/prayer-times-api" target="_blank" rel="noopener">Prayer times by AlAdhan ↗</a></section>'}

function prayerRequest(url,callback){var x,done=false;function finish(err,data){if(done)return;done=true;callback(err,data)}try{x=new XMLHttpRequest();x.open('GET',url,true);x.timeout=20000;x.onload=function(){if(x.status!==200){finish('Prayer service returned HTTP '+x.status+'.');return}var v;try{v=JSON.parse(x.responseText)}catch(e){finish('Invalid prayer response.');return}finish(null,v)};x.onerror=function(){finish('Prayer download failed. Check internet and certificates; saved dates still work.')};x.ontimeout=function(){finish('Prayer download timed out; saved dates still work.')};x.onabort=function(){finish('Prayer download interrupted.')};x.send()}catch(e){finish('Browser could not request prayer times. '+(e.name||''))}}
window.refreshPrayers=function(force){if(prayerBusy||(!force&&Date.now()-prayerAttempt<30*60000))return;var now=Date.now(),n=nyParts(now),nextMonth=n.month===12?1:n.month+1,nextYear=n.month===12?n.year+1:n.year,months=[[n.year,n.month],[nextYear,nextMonth]],method=ps.method,school=ps.school;var todo=months.filter(function(m){var c=ps.cache[prayerMonthKey(m[0],m[1])];return force||!c||now-c.fetched>24*3600000});if(!todo.length)return;prayerBusy=true;prayerAttempt=now;prayerError='';paintPrayer();function step(){if(!todo.length||ps.method!==method||ps.school!==school){prayerBusy=false;paintPrayer();return}var m=todo.shift(),url='https://api.aladhan.com/v1/calendar/'+m[0]+'/'+m[1]+'?latitude=40.7282&longitude=-73.7949&method='+method+'&school='+school+'&timezonestring=America%2FNew_York&iso8601=true';prayerRequest(url,function(err,res){if(ps.method!==method||ps.school!==school){prayerBusy=false;prayerAttempt=0;refreshPrayers(true);return}if(!err){try{if(res.code!==200||!Array.isArray(res.data))throw Error();var days=res.data.map(function(d){if(d.meta.timezone!=='America/New_York')throw Error();var g=d.date.gregorian,date=g.year+'-'+('0'+g.month.number).slice(-2)+'-'+('0'+g.day).slice(-2),times=prayerNames.map(function(name){var t=prayerIso(d.timings[name]);if(!isFinite(t))throw Error();return t});return {date:date,times:times}});if(days.length!==new Date(Date.UTC(m[0],m[1],0)).getUTCDate()||days.some(function(d,i){return d.date!==m[0]+'-'+('0'+m[1]).slice(-2)+'-'+('0'+(i+1)).slice(-2)}))throw Error();ps.cache[prayerMonthKey(m[0],m[1])]={fetched:Date.now(),days:days};var keep=months.map(function(a){return prayerMonthKey(a[0],a[1])});Object.keys(ps.cache).forEach(function(k){if(keep.indexOf(k)<0)delete ps.cache[k]});prayerStore()}catch(e){err='Prayer calendar response was incomplete. Previous saved calendar retained.'}}if(err)prayerError=err;step()})}step()};
function audioStatus(text){prayerAudioStatus=text;var el=document.getElementById('prayeraudiostatus');if(el)el.textContent=text;var el2=document.getElementById('prayeraudiohint');if(el2)el2.textContent=text}
function validAdhanSource(v){return /^file:\/\/\/(sdcard|storage\/emulated\/0)\/[^<>]+\.mp3$/i.test(v)||/^https:\/\/[^\s<>]+$/i.test(v)}
function playAdhan(label){if(!validAdhanSource(ps.audio)){audioStatus('Choose a local MP3 path or HTTPS audio URL in Prayer settings.');return}if(!prayerAudio){try{prayerAudio=document.getElementById("prayerplayer");if(!prayerAudio||typeof prayerAudio.play!=="function")prayerAudio=new Audio()}catch(e){audioStatus('Audio is unavailable in this browser.');return}}var token=++prayerPlayToken;prayerAudio.pause();prayerAudio.src=ps.audio;prayerAudio.volume=ps.volume/100;prayerAudio.onplaying=function(){if(token===prayerPlayToken)audioStatus('Playing '+label+' at '+prayerTime(Date.now()))};prayerAudio.onended=function(){if(token===prayerPlayToken)audioStatus(label+' finished. Automatic adhan '+(ps.enabled?'is on.':'is off.'))};prayerAudio.onerror=function(){if(token===prayerPlayToken)audioStatus('Audio failed. Check the MP3 path and Fully storage permission. Then test again.')};audioStatus('Starting '+label+'…');try{var result=prayerAudio.play();if(result&&result.catch)result.catch(function(){if(token===prayerPlayToken)audioStatus('Audio blocked. Enable Autoplay Audio in Fully, then test again.')});setTimeout(function(){if(token===prayerPlayToken&&prayerAudio.paused)audioStatus('Audio did not start. Check the MP3 file, device volume and Fully Autoplay Audio setting.')},8000)}catch(e){audioStatus('Could not start audio. Check file access and autoplay settings.')}}
window.testAdhan=function(){playAdhan('adhan test')};window.testAdhanLater=function(){prayerTrial=Date.now()+10000;audioStatus('Automatic audio test scheduled in 10 seconds. Leave this page open.')};window.stopAdhan=function(){prayerTrial=0;prayerPlayToken++;if(prayerAudio)prayerAudio.pause();audioStatus('Stopped. Scheduled test cancelled.')};
window.prayerSettings=function(){var body='<p>Queens, NY · Eastern time, including daylight saving.</p><label>Calculation method<select id="pmethod">'+Object.keys(prayerMethods).map(function(k){return '<option value="'+k+'" '+(ps.method===k?'selected':'')+'>'+prayerMethods[k]+'</option>'}).join('')+'</select></label><label>Asr convention<select id="pschool"><option value="0" '+(ps.school==='0'?'selected':'')+'>Standard (Shafi, Maliki, Hanbali)</option><option value="1" '+(ps.school==='1'?'selected':'')+'>Hanafi</option></select></label><label>Automatic adhan<select id="penabled"><option value="no">Off</option><option value="yes" '+(ps.enabled?'selected':'')+'>On</option></select></label><label>Adhan MP3 path or HTTPS URL<input id="paudio" value="'+esc(ps.audio)+'" placeholder="file:///sdcard/Download/adhan.mp3"></label><p class="muted">No recording is bundled. Copy your adhan.mp3 into the frame’s Download folder. Test audio before enabling automatic adhan.</p><label>Volume (0–100)<input type="number" id="pvolume" min="0" max="100" value="'+ps.volume+'"></label><h3>Prayer audio and minute adjustments</h3>'+prayerNames.map(function(name){return '<div class="prayersettingrow"><label><input type="checkbox" id="pon'+name+'" '+(!ps.muted[name]?'checked':'')+'> '+name+'</label><input aria-label="'+name+' adjustment in minutes" id="poff'+name+'" type="number" min="-30" max="30" value="'+(Number(ps.offsets[name])||0)+'"></div>'}).join('')+'<p class="muted">Offsets are minutes added to calculated start times, from −30 to +30. Master adhan must be on as well. Times are not iqamah times.</p><p class="muted">Keep the frame awake with Fully running. Enable Fully’s Autoplay Audio and test automatic playback after each reboot. Missed prayers are not replayed later.</p>';modal('Prayer settings',body);document.getElementById('editform').onsubmit=function(e){e.preventDefault();var method=document.getElementById('pmethod').value,school=document.getElementById('pschool').value,source=document.getElementById('paudio').value.trim(),vol=Number(document.getElementById('pvolume').value),enabled=document.getElementById('penabled').value==='yes';if(!validAdhanSource(source)){alert('Use a local file:///sdcard/Download/adhan.mp3 path or an HTTPS audio URL.');return}if(!prayerMethods[method]||!/^[01]$/.test(school)||!isFinite(vol)||vol<0||vol>100)return;var offsets={},muted={};for(var i=0;i<prayerNames.length;i++){var name=prayerNames[i],v=Number(document.getElementById('poff'+name).value);if(!isFinite(v)||v< -30||v>30){alert('Adjustments must be between -30 and 30 minutes.');return}offsets[name]=Math.round(v);muted[name]=!document.getElementById('pon'+name).checked}var changed=ps.method!==method||ps.school!==school;ps.method=method;ps.school=school;ps.audio=source;ps.volume=vol;ps.enabled=enabled;ps.offsets=offsets;ps.muted=muted;if(!enabled)stopAdhan();if(prayerAudio)prayerAudio.volume=vol/100;prayerStore();closeModal();paintPrayer();if(tab==='Clock & Weather')render();if(changed){prayerAttempt=0;refreshPrayers(true)}}};
function prayerTick(){var now=Date.now(),today=prayerDateKey(now),next=prayerNext(now);if(prayerTrial&&now>=prayerTrial){var late=now-prayerTrial;prayerTrial=0;if(late<60000)playAdhan('automatic audio test');else audioStatus('Audio test missed while app was inactive. Please test again.')}if(ps.enabled){var rows=prayerRows();for(var i=0;i<rows.length;i++){var r=rows[i];if(now>=r.at&&now-r.at<60000&&!ps.muted[r.name]&&!ps.fired[r.key]){ps.fired[r.key]=now;Object.keys(ps.fired).forEach(function(k){if(now-ps.fired[k]>45*86400000)delete ps.fired[k]});if(prayerStore())playAdhan(r.name+' adhan');break}}}var draw=today+'|'+(next?next.key:'none');if(draw!==prayerDrawKey){prayerDrawKey=draw;paintPrayer()}var cd=document.getElementById('prayercountdown');if(cd)cd.textContent=next?prayerCountdown(next.at-now):'Connect to download upcoming dates';var compact=document.getElementById('prayercompactnext');if(compact)compact.textContent=next?next.name+' · '+prayerTime(next.at)+' · '+prayerCountdown(next.at-now):'Tap to load prayer times';if(today!==prayerLastDay){prayerLastDay=today;prayerAttempt=0}refreshPrayers(false)}

function tick(){var d=new Date();document.getElementById('datehead').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});document.getElementById('clock').textContent=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,30000);render();setInterval(updateBigClock,1000);setInterval(function(){if(tab==='Clock & Weather')loadWeather(false)},60000);if(tab==='Clock & Weather')loadWeather(false);setInterval(prayerTick,1000);setTimeout(prayerTick,1200);})();
</script></html>
